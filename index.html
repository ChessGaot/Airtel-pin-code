<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India City Town PIN Master</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 25px;
    background: #f4f6f8;
}

.container {
    max-width: 1100px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
}

h2 {
    margin-top: 0;
}

.controls {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

input {
    flex: 1;
    padding: 10px;
    font-size: 15px;
}

button {
    padding: 10px 18px;
    background: #217346;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #185c37;
}

.tableBox {
    max-height: 650px;
    overflow-y: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 9px;
    text-align: left;
}

th {
    background: #217346;
    color: white;
    position: sticky;
    top: 0;
}

tr:nth-child(even) {
    background: #f7f7f7;
}

tr:hover {
    background: #e8f3ec;
}

#count {
    margin: 10px 0;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h2>India City / Town – PIN Code Master</h2>

<div class="controls">

<input
    type="text"
    id="search"
    placeholder="Search City, Town or PIN Code..."
    onkeyup="filterTable()">

<button onclick="downloadCSV()">
Export to Excel
</button>

</div>

<div id="count"></div>

<div class="tableBox">

<table id="cityTable">

<thead>
<tr>
<th>PIN Code</th>
<th>City / Town Name</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

/* BUILD TABLE */

function buildTable(data) {

    const tbody =
        document.getElementById("tableBody");

    tbody.innerHTML = "";

    data.forEach(row => {

        const tr =
            document.createElement("tr");

        tr.innerHTML =
            "<td>" + row[0] + "</td>" +
            "<td>" + row[1] + "</td>";

        tbody.appendChild(tr);

    });

    document.getElementById("count")
        .innerText =
        "Total Cities / Towns: " + data.length;
}


/* SEARCH */

function filterTable() {

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const filtered =
        cityData.filter(row =>

            row[0].includes(search) ||
            row[1].toLowerCase().includes(search)

        );

    buildTable(filtered);
}


/* EXPORT CSV */

function downloadCSV() {

    let csv =
        "PIN Code,City / Town Name\n";

    cityData.forEach(row => {

        csv +=
            '"' + row[0] + '",' +
            '"' + row[1].replace(/"/g,'""') + '"\n';

    });

    const blob =
        new Blob(
            [csv],
            {type:"text/csv;charset=utf-8;"}
        );

    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "India_City_Town_PIN_Master.csv";

    link.click();

}


/* LOAD */

buildTable(cityData);
